[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "OFL-1.1", "Ubuntu-font-1.0", "CDLA-Permissive-2.0", "CC0-1.0", "BSL-1.0"]

